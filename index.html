<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vorratio</title>
  <meta name="description" content="Vorratio – Vorrats- und Rezept-App. Kennt deinen Bestand, schlägt Rezepte vor, führt durchs Kochen und bucht den Verbrauch automatisch ab." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vorratio" />
  <meta name="theme-color" content="#f7f6f2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>Vorratio braucht JavaScript.</noscript>
  </div>
  <nav id="tabbar" class="tabbar" hidden>
    <button data-view="heute" class="tab active"><span class="tab-icon">☀︎</span>Heute</button>
    <button data-view="vorrat" class="tab"><span class="tab-icon">▤</span>Vorrat</button>
    <button data-view="einkauf" class="tab"><span class="tab-icon">✓</span>Einkauf</button>
    <button data-view="wissen" class="tab"><span class="tab-icon">✎</span>Wissen</button>
    <button data-view="profil" class="tab"><span class="tab-icon">◍</span>Profil</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
