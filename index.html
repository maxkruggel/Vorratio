<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vorratio</title>
  <meta name="description" content="Vorratio – Vorrats- und Rezept-App. Kennt deinen Bestand, schlägt Rezepte vor, führt durchs Kochen und bucht den Verbrauch automatisch ab." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vorratio" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3efe5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101410" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>Vorratio braucht JavaScript.</noscript>
  </div>
  <!-- Tabbar-Icons: Duotone-Set aus der Design-Übergabe, identisch zu js/icons.js.
       Flächen tragen .duo, damit der aktive Tab sie über --duo einfärbt. -->
  <nav id="tabbar" class="tabbar" hidden>
    <button data-view="heute" class="tab active" aria-label="Heute">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle class="duo" cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>heute</span>
    </button>
    <button data-view="vorrat" class="tab" aria-label="Vorrat">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path class="duo" d="M6.6 9.2h10.8v9.6a2.6 2.6 0 0 1-2.6 2.6H9.2a2.6 2.6 0 0 1-2.6-2.6z" stroke="currentColor" stroke-width="1.6"/><path d="M8.4 9.2V5.4a1.8 1.8 0 0 1 1.8-1.8h3.6a1.8 1.8 0 0 1 1.8 1.8v3.8M6.6 14.4h10.8" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>vorrat</span>
    </button>
    <button data-view="einkauf" class="tab" aria-label="Einkauf">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path class="duo" d="M4.4 8.6h15.2l-1.5 10a2.2 2.2 0 0 1-2.2 1.9H8.1a2.2 2.2 0 0 1-2.2-1.9z" stroke="currentColor" stroke-width="1.6"/><path d="M8.8 8.6l2.2-5.2M15.2 8.6L13 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>einkauf</span>
    </button>
    <button data-view="wissen" class="tab" aria-label="Wissen">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path class="duo" d="M4 4.6h6.2a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 4.6h-6.2a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2H20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>wissen</span>
    </button>
    <button data-view="profil" class="tab" aria-label="Profil">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle class="duo" cx="12" cy="8.4" r="3.8" stroke="currentColor" stroke-width="1.6"/><path d="M4.8 20.4c.7-3.9 3.7-5.9 7.2-5.9s6.5 2 7.2 5.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>profil</span>
    </button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
